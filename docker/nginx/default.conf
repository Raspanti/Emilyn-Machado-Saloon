server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    
    # Define a pasta public como a raiz do servidor web (Segurança!)
    root /var/www/html/public; 

    # Trata as requisições normais de arquivos estáticos (CSS, JS, imagens)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Quando a requisição for um arquivo .php, envia para o container "app" na porta 9000
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Repare que usamos o nome do serviço do docker-compose "app" em vez de um IP fixo
        fastcgi_pass app:9000; 
        
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}