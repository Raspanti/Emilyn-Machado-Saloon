services:
  app:
    image: php:8.3-fpm-alpine
    container_name: Saloon-app
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html

  web:
    image: nginx:alpine
    container_name: Saloon-web
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: Saloon-db
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: Saloon_db
      MYSQL_USER: Saloon_user
      MYSQL_PASSWORD: Saloon_password
    volumes:
      - Saloon-db-data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: Saloon-adminer
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db



volumes:
  Saloon-db-data: